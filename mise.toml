min_version = "2026.11.10"

[env]
DATABASE_URL = "postgresql://radinage:radinage@localhost:5432/radinage"

[settings]
disable_backends = ["asdf", "vfox"]
lockfile = true

[tools]
"cargo:cargo-edit" = "0.13.14"
hadolint = "2.15.1"
helm = "4.3.2"
helm-docs = "1.14.2"
jq = "1.8.2"
node = "26.13.1"
pre-commit = "4.7.0"
python = "3.15.2"
rust = { version = "1.100.0", components = [
  "rustfmt",
  "clippy"
], profile = "minimal" }
shellcheck = "0.11.0"
task = "3.54.0"
trivy = "0.76.2"
