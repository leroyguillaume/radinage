version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "cargo:"
    groups:
      cargo:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /radinage-webapp
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "webapp:"
    groups:
      # Mantine packages only work against the matching @mantine/core release.
      mantine:
        patterns:
          - "@mantine/*"
      # The router, its Vite plugin and devtools are released in lockstep.
      tanstack-router:
        patterns:
          - "@tanstack/router*"
          - "@tanstack/react-router*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # Dependabot puts a dependency in its most specific matching group, not
      # the first one, and a group without patterns outranks any wildcard:
      # without "*" this catch-all swallows the lockstep groups above.
      # https://github.com/dependabot/dependabot-core/issues/11093
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - dependencies
    commit-message:
      prefix: "docker:"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - dependencies
    commit-message:
      prefix: "docker:"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - dependencies
    commit-message:
      prefix: "ci:"
    groups:
      github-actions:
        update-types:
          - minor
          - patch
