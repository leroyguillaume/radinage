name: chart

on:
  push:
    tags:
      - chart-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_DIR: helm/radinage

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: derive the version from the tag
        id: version
        run: |
          case "$GITHUB_REF_NAME" in
            chart-*) ;;
            *)
              echo "Run this workflow on a chart-X.Y.Z tag, not ${GITHUB_REF_NAME}." >&2
              exit 1
              ;;
          esac
          version="${GITHUB_REF_NAME#chart-}"
          committed="$(sed -n 's/^version: //p' "$CHART_DIR/Chart.yaml")"
          if [ "$committed" != "$version" ]; then
            echo "Chart.yaml says ${committed} but the tag says ${version}." >&2
            echo "Cut releases with scripts/release.sh --chart so the two stay in step." >&2
            exit 1
          fi
          if [ "${version#*-}" = "$version" ] && ! grep -q -- "--version ${version}" README.md; then
            echo "README.md does not install chart ${version}." >&2
            echo "Cut releases with scripts/release.sh --chart so the two stay in step." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: install Helm
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
          install_args: helm

      - name: package the chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: helm package "$CHART_DIR" --version "$VERSION"

      # actions/attest reads Docker's credentials only; Helm falls back to them.
      - name: log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push the chart to GHCR
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          output="$(helm push "radinage-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts" 2>&1)"
          printf '%s\n' "$output"
          digest="$(sed -n 's/^Digest: //p' <<< "$output")"
          [ -n "$digest" ] || { echo "helm push printed no digest." >&2; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: attest the chart
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/radinage
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
