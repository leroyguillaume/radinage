name: renovate

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Log what Renovate would do without pushing branches or opening PRs
        type: boolean
        default: false
      logLevel:
        description: Renovate log level
        type: choice
        default: info
        options:
          - info
          - debug

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-24.04
    steps:
      - name: run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: mise
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
